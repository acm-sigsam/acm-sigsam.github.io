  - 'steering-committee.phtml (the page linked from index.phtml) has no date; it is used for steering_committee. steering-committee.html is an older version (last modified 3 August 2007); differences: Jeremy Johnson (2005-2008) and Gerhard Hiss (Fachgruppe, 2006-2009) in the older page are replaced by Michael Monagan (2008-2011) and Elkedagmar Heinrich (Fachgruppe, 2008 - 2011) in the newer page.'
  - 'Members fall into two categories: Members-at-Large, elected for three years, and Organizational Members. No affiliations are given; e-mail addresses are given but omitted here.'
  - No current chair is marked in steering-committee.phtml; in steering-committee.html Mark Giesbrecht is marked '(chair)' in a commented-out row.
  - 'Bylaws (last modified 25 November 2002): committee of three organizational members (elected chairs of well-established organizations) and three members-at-large, three-year terms; chair chosen every year by the six members.'
  - 'index.phtml: the series dates back to 1966, with ISSAC 96 being the 21st meeting; the name ''ISSAC'' was first used for the 1988 meeting, when the European EUROSAM/EUROCAL/EUROCAM conferences were merged with the North American SYMSAM/SYMSAC stream; the majority of meetings have been sponsored by ACM SIGSAM.'
