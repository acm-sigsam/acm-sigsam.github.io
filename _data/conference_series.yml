- id: sc2
  short: SC²
  name: International Workshop on Satisfiability Checking and Symbolic Computation
  status: active
  webpage: null
  description:
  - SC 2 brings together researchers from the two communities of Satisfiability Checking (who develop SAT and SMT solvers) and Symbolic Computation (who develop Computer Algebra Systems).
  - The workshop is currently being held annually funded by the EU H2020 Project SC 2. The workshop plans to continue after the lifecycle of the project.
  source: website/Resources/ConferenceSeries.html
- id: scss
  short: SCSS
  name: International Symposium on Symbolic Computation in Software Science
  status: active
  webpage: http://www.risc.jku.at/conferences/scss/index.html
  description:
  - 'SCSS promotes research on theoretical and practical aspects of symbolic computation in software sciences. It aims for dialog between researchers in: computer algebra, algebraic geometry, algorithmic combinatorics, computational logic, and software analysis and verification. The series started out promoting collaboration between groups in Austria, Tunisia and Japan and has now grown to an international symposium.'
  - Series Website
  - Submission is either a Short, Regular and Tool (software) paper, with proceedings distributed at the meeting. Full papers can later be considered for special issues of the Journal of Symbolic Computation (see Volume 45, Issue 5, 2010 and Volume 69, 2015).
