    items:
    - The Steering Committee begins work on July 12, 1995.
    - 'Organizational members with given terms: the SIGSAM chair (3 years), the Speaker of the Fachgruppe for Computer Algebra (2 years), and Hidetsune Kobayashi (1 year).'
    - At the ISSAC'95 business meeting three members-at-large (one, two or three year terms, by lottery) to be elected from Manuel Bronstein, Arjeh M. Cohen, Marc Giusti, Teo Mora, Tomas Recio, and those present who wish to be considered.
    - The Steering Committee honors all decisions already made in regard to ISSAC'96, ISSAC'97, and ISSAC'98.
