---
title: News
permalink: /news/
---
{% assign items = site.news | sort: "date" | reverse %}
{% if items.size > 0 %}
<ul class="dated">
  {% for item in items %}
  <li><time datetime="{{ item.date | date_to_xmlschema }}">{{ item.date | date: "%Y-%m-%d" }}</time><a href="{{ item.url | relative_url }}">{{ item.title }}</a></li>
  {% endfor %}
</ul>
{% else %}
<p>No news yet.</p>
{% endif %}
