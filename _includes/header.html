<header class="site-header">
  <div class="container header-inner">
    <a class="site-logo" href="{{ '/' | relative_url }}">
      <img src="{{ '/assets/pictures/logo/sigsam-logo.png' | relative_url }}" alt="ACM SIGSAM" width="103" height="45">
    </a>
    <nav class="site-nav" aria-label="Main">
      {% for item in site.data.navigation %}
        <a href="{{ item.url | relative_url }}"{% if page.url contains item.url %} aria-current="page"{% endif %}>{{ item.title }}</a>
      {% endfor %}
    </nav>
  </div>
</header>
