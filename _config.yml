title: ACM SIGSAM
description: Special Interest Group on Symbolic and Algebraic Manipulation
url: ""        # e.g. https://www.sigsam.org once the domain points to GitHub Pages
baseurl: ""    # e.g. /sigsam if served from a project page
markdown: kramdown
# Publish documents dated in the future (upcoming conferences such as ISSAC 2027).
future: true

# Collections live in _awards/, _news/, _conferences/, _software/, _books/, _journals/, _officers/ and _board/ (Jekyll requires the underscore).
# Awards are grouped in one subfolder per award type, e.g. _awards/jenks-prize/2021-cohen.md;
# conferences in one subfolder per series, e.g. _conferences/issac/2024.md.
collections:
  awards:
    output: true
    permalink: /awards/:path/
  news:
    output: true
    permalink: /news/:year/:month/:day/:title/
  conferences:
    output: true
    permalink: /conferences/:path/
  software:
    output: true
    permalink: /software/:name/
  books:
    output: true
    permalink: /books/:name/
  journals:
    output: true
    permalink: /journals/:name/
  officers:
    output: true
    permalink: /officers/:name/
  board:
    output: true
    permalink: /board/:name/

defaults:
  - scope: { path: "", type: awards }
    values: { layout: award }
  - scope: { path: "", type: news }
    values: { layout: news }
  - scope: { path: "", type: conferences }
    values: { layout: conference }
  - scope: { path: "", type: software }
    values: { layout: software }
  - scope: { path: "", type: books }
    values: { layout: book }
  - scope: { path: "", type: journals }
    values: { layout: journal }
  - scope: { path: "", type: officers }
    values: { layout: officer }
  - scope: { path: "", type: board }
    values: { layout: board }
  - scope: { path: "" }
    values: { layout: page }

# Number of items in the news column.
news_column_items: 6

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
